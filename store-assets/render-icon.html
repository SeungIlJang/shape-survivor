<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#0d0f1a}
  #wrap{width:512px;height:512px}
  svg{display:block}
</style></head><body>
<div id="wrap">
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141830"/>
      <stop offset="1" stop-color="#0a0c16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#5ce1ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5ce1ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tri" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8af0ff"/>
      <stop offset="1" stop-color="#37c6ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!-- swarming enemies -->
  <circle cx="96"  cy="120" r="26" fill="#ff5c7a"/>
  <circle cx="420" cy="112" r="18" fill="#ff9ec4"/>
  <circle cx="96"  cy="404" r="22" fill="#ff8a5c"/>
  <rect x="388" y="384" width="46" height="46" rx="9" fill="#5cd9c0" transform="rotate(20 411 407)"/>
  <circle cx="440" cy="300" r="14" fill="#ff5c7a"/>
  <circle cx="72"  cy="256" r="13" fill="#ff9ec4"/>
  <!-- gold gems -->
  <polygon points="150,150 164,164 150,178 136,164" fill="#ffd25c"/>
  <polygon points="360,180 372,192 360,204 348,192" fill="#ffd25c"/>
  <!-- hero triangle (세모) -->
  <polygon points="256,180 350,352 162,352" fill="url(#tri)" stroke="#eafbff" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="256" cy="300" r="19" fill="#0d0f1a"/>
  <circle cx="262" cy="294" r="6" fill="#eafbff"/>
</svg>
</div>
</body></html>
