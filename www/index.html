<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>갤로그의 귀환</title>
<style>
  html,body{margin:0;height:100%;background:#0a0c16;overflow:hidden}
  #ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#7a86a8;font-family:system-ui,-apple-system,sans-serif;gap:14px}
  .sp{width:42px;height:42px;border:5px solid rgba(255,255,255,.15);border-top-color:#ff7a2c;border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style></head>
<body>
<div id="ld"><div class="sp"></div><div>갤로그의 귀환 불러오는 중…</div></div>
<script>
// ── OTA 로더: 원격 최신 게임 로드(+오프라인 폴백) ──
(function(){
  var GAME='gallog';
  var REMOTE='https://seungiljang.github.io/games/'+GAME+'.html';
  var KEY='ota_'+GAME;
  var done=false;
  function render(html){ try{ document.open(); document.write(html); document.close(); }catch(e){ location.replace('game.html'); } }
  function fallback(){ var c=null; try{ c=localStorage.getItem(KEY); }catch(e){} if(c){ render(c); } else { location.replace('game.html'); } }
  var ctrl = window.AbortController ? new AbortController() : null;
  var to = setTimeout(function(){ if(done)return; done=true; if(ctrl){try{ctrl.abort();}catch(e){}} fallback(); }, 5000);
  try{
    fetch(REMOTE+'?t='+Date.now(), {cache:'no-store', signal: ctrl?ctrl.signal:undefined})
      .then(function(r){ if(!r.ok) throw 0; return r.text(); })
      .then(function(html){ if(done)return; done=true; clearTimeout(to); if(!html||html.length<500) throw 0; try{ localStorage.setItem(KEY, html); }catch(e){} render(html); })
      .catch(function(){ if(done)return; done=true; clearTimeout(to); fallback(); });
  }catch(e){ done=true; clearTimeout(to); fallback(); }
})();
</script>
</body></html>
